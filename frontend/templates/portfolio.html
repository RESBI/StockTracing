{% extends "base.html" %}
{% block nav_portfolio %}text-text bg-white/5{% endblock %}
{% block content %}
<div class="p-6">
    <h1 class="text-xl font-bold mb-1">持仓分析</h1>
    <p class="text-sm text-mute mb-6">当前持仓、盈亏分布与收益曲线</p>

    <!-- Top row: Summary + Pies -->
    <div class="grid grid-cols-2 gap-4 mb-6" style="min-height:0">
        <!-- Left: stacked summary (match height to pies) -->
        <div class="flex flex-col justify-between gap-3">
            <div class="grid grid-cols-2 gap-3">
                <div class="card p-4 text-center"><p class="text-xs text-mute mb-1">持仓成本</p><p class="text-2xl font-bold" id="s-cost">—</p></div>
                <div class="card p-4 text-center"><p class="text-xs text-mute mb-1">持仓总值</p><p class="text-2xl font-bold" id="s-total">—</p></div>
            </div>
            <div class="card p-4 text-center flex-1 flex flex-col justify-center"><p class="text-xs text-mute mb-1">总浮盈</p><p class="text-2xl font-bold" id="s-pnl">—</p></div>
            <div class="card p-4 text-center flex-1 flex flex-col justify-center"><p class="text-xs text-mute mb-1">标的总数</p><p class="text-2xl font-bold" id="s-syms">—</p></div>
        </div>
        <!-- Right: Symbol + Sector pies side by side -->
        <div class="grid grid-cols-2 gap-4">
            <div class="card p-4">
                <h3 class="text-sm font-semibold text-mute mb-3">标的占比</h3>
                <div style="position:relative;height:220px"><canvas id="symbol-pie"></canvas></div>
            </div>
            <div class="card p-4">
                <h3 class="text-sm font-semibold text-mute mb-3">领域占比</h3>
                <div style="position:relative;height:220px"><canvas id="sector-pie"></canvas></div>
            </div>
        </div>
    </div>

    <!-- P&L Curve -->
    <div class="card p-4 mb-6">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-mute">收益曲线</h3>
            <div class="flex gap-1">
                <button class="btn btn-outline btn-xs" id="btn-1d" onclick="loadPnlCurve('1d')">日线</button>
                <button class="btn btn-acc btn-xs" id="btn-1h" onclick="loadPnlCurve('1h')">小时</button>
            </div>
        </div>
        <div style="position:relative;height:280px"><canvas id="pnl-chart"></canvas></div>
    </div>

    <!-- Holdings detail -->
    <div class="card p-4">
        <h3 class="text-sm font-semibold text-mute mb-3">持仓明细</h3>
        <div class="flex items-center gap-4 px-2 mb-1 text-xs text-mute font-medium">
            <span class="w-24 shrink-0">代码 / 名称</span>
            <span class="w-16 shrink-0 text-center">股数</span>
            <span class="w-24 shrink-0 text-center">成本价</span>
            <span class="w-24 shrink-0 text-center">现价</span>
            <span class="w-20 shrink-0 text-center">涨跌</span>
        </div>
        <div id="holdings-detail" class="space-y-1.5"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let symbolChart=null,sectorChart=null,pnlChart=null;

async function loadPortfolio(){
    try{
        const data=await api('/trades/portfolio?interval=1h');
        document.getElementById('s-cost').textContent='$'+data.total_cost.toFixed(2);
        document.getElementById('s-total').textContent='$'+data.total_value.toFixed(2);
        const totalPnl=data.holdings.reduce((s,h)=>s+h.pnl,0);
        const pnlEl=document.getElementById('s-pnl');
        pnlEl.textContent='$'+totalPnl.toFixed(2);
        pnlEl.className='text-2xl font-bold '+(totalPnl>=0?'up':'down');
        document.getElementById('s-syms').textContent=data.symbol_pie.length;
        renderPies(data);
        renderHoldings(data.holdings);
        renderPnlCurve(data.pnl_curve);
    }catch(e){}
}

async function loadPnlCurve(interval){
    document.getElementById('btn-1d').className='btn '+(interval==='1d'?'btn-acc':'btn-outline')+' btn-xs';
    document.getElementById('btn-1h').className='btn '+(interval==='1h'?'btn-acc':'btn-outline')+' btn-xs';
    try{const data=await api('/trades/portfolio?interval='+interval);renderPnlCurve(data.pnl_curve);}catch(e){}
}

function renderPies(data){
    const colors=['#296BEF','#00B887','#F59E0B','#F54D4D','#805ad5','#3182ce','#38a169','#dd6b20','#e53e3e','#8b5cf6'];
    function makePie(ctx,chartVar,items){
        if(chartVar)chartVar.destroy();
        const sorted=[...items].sort((a,b)=>b.value-a.value);
        const total=sorted.reduce((s,i)=>s+i.value,0);
        const labels=sorted.map(d=>d.name);
        const values=sorted.map(d=>d.value);
        const pcts=sorted.map(d=>(d.value/total*100).toFixed(1)+'%');
        return new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:colors}]},
            options:{responsive:true,maintainAspectRatio:false,
                plugins:{legend:{position:'right',labels:{color:'#848E9C',font:{size:12},padding:14,boxWidth:10,usePointStyle:true,
                    generateLabels:function(chart){var ds=chart.data.datasets[0];return chart.data.labels.map(function(l,i){return{text:'  '+pcts[i]+'  '+l,fillStyle:ds.backgroundColor[i],strokeStyle:ds.backgroundColor[i],lineWidth:0,hidden:false,index:i,fontColor:'#848E9C',pointStyle:'circle',pointStyleWidth:8}});}}},
                tooltip:{callbacks:{label:function(ctx){return ctx.label+': '+pcts[ctx.dataIndex]+' ($'+values[ctx.dataIndex].toFixed(2)+')';}}}}}});
    }
    symbolChart=makePie(document.getElementById('symbol-pie').getContext('2d'),symbolChart,data.symbol_pie);
    sectorChart=makePie(document.getElementById('sector-pie').getContext('2d'),sectorChart,data.sector_pie);
}

function renderHoldings(holdings){
    var c=document.getElementById('holdings-detail');
    if(!holdings.length){c.innerHTML='<p class="text-mute text-sm text-center py-4">暂无持仓</p>';return;}
    c.innerHTML=holdings.map(function(h){
        var cost=h.open_price*h.quantity;
        var val=h.current_price*h.quantity;
        var chgPct=((h.current_price-h.open_price)/h.open_price*100);
        return '<div class="card px-4 py-2 bg-[#151b28]"><div class="flex items-center gap-4">'+
            '<div class="w-24 shrink-0 leading-tight"><span class="font-bold text-sm block">'+h.symbol+'</span><span class="text-mute text-[10px] block">'+(h.direction==='long'?'做多':'做空')+'</span></div>'+
            '<span class="w-16 shrink-0 text-center text-base font-bold">'+h.quantity+'</span>'+
            '<div class="w-24 shrink-0 text-center leading-tight"><div class="font-medium text-sm">$'+h.open_price.toFixed(2)+'</div><div class="text-[11px] text-mute">$'+cost.toFixed(2)+'</div></div>'+
            '<div class="w-24 shrink-0 text-center leading-tight"><div class="'+(h.pnl>=0?'up':'down')+' font-medium text-sm">$'+h.current_price.toFixed(2)+'</div><div class="'+(val>=cost?'up':'down')+' text-[11px]">$'+val.toFixed(2)+'</div></div>'+
            '<div class="w-20 shrink-0 text-center text-xs"><span class="'+(chgPct>=0?'up':'down')+'">'+(chgPct>=0?'+':'')+chgPct.toFixed(2)+'%</span></div>'+
        '</div></div>';
    }).join('');
}

function renderPnlCurve(curve){
    if(!curve.length)return;
    var ctx=document.getElementById('pnl-chart').getContext('2d');
    if(pnlChart)pnlChart.destroy();
    var lastPnl=curve[curve.length-1].pnl;
    pnlChart=new Chart(ctx,{type:'line',data:{labels:curve.map(function(d){return d.date}),datasets:[{label:'累计盈亏',data:curve.map(function(d){return d.pnl}),
        borderColor:lastPnl>=0?'#00B887':'#F54D4D',backgroundColor:(lastPnl>=0?'#00B887':'#F54D4D')+'10',fill:true,tension:.3,pointRadius:0,borderWidth:2}]},
        options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
            plugins:{legend:{display:false},tooltip:{backgroundColor:'#1A2030',titleColor:'#E8EAED',bodyColor:'#848E9C',borderColor:'#2A3040',borderWidth:1}},
            scales:{x:{ticks:{color:'#4A5466',maxTicksLimit:8,autoSkip:true},grid:{color:'#1A2030'}},y:{ticks:{color:'#4A5466',callback:function(v){return '$'+v.toFixed(0)}},grid:{color:'#1A2030'}}}}});
}

loadPortfolio();
</script>
{% endblock %}
