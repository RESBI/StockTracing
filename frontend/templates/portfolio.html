{% extends "base.html" %}
{% block nav_portfolio %}text-text bg-white/5{% endblock %}
{% block content %}
<div class="p-6">
    <h1 class="text-xl font-bold mb-1">持仓分析</h1>
    <p class="text-sm text-mute mb-6">当前持仓、盈亏分布与收益曲线</p>

    <!-- Top: Summary + Pies -->
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="flex flex-col justify-between gap-3">
            <div class="grid grid-cols-2 gap-3">
                <div class="card p-4 text-center"><p class="text-xs text-mute mb-1">持仓成本</p><p class="text-2xl font-bold" id="s-cost">—</p></div>
                <div class="card p-4 text-center"><p class="text-xs text-mute mb-1">持仓总值</p><p class="text-2xl font-bold" id="s-total">—</p></div>
            </div>
            <div class="card p-4 text-center flex-1 flex items-center justify-center"><div><p class="text-xs text-mute mb-1">总浮盈</p><p class="text-2xl font-bold" id="s-pnl">—</p></div></div>
            <div class="card p-4 text-center flex-1 flex items-center justify-center"><div><p class="text-xs text-mute mb-1">标的总数</p><p class="text-2xl font-bold" id="s-syms">—</p></div></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="card p-4"><h3 class="text-sm font-semibold text-mute mb-3">标的占比</h3><div style="position:relative;height:220px"><canvas id="symbol-pie"></canvas></div></div>
            <div class="card p-4"><h3 class="text-sm font-semibold text-mute mb-3">领域占比</h3><div style="position:relative;height:220px"><canvas id="sector-pie"></canvas></div></div>
        </div>
    </div>

    <!-- P&L Curve -->
    <div class="card p-4 mb-6">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-mute">收益曲线</h3>
            <div class="flex gap-1">
                <button class="btn btn-outline btn-xs" id="btn-1d" onclick="loadPnlCurve('1d')">日线</button>
                <button class="btn btn-acc btn-xs" id="btn-1h" onclick="loadPnlCurve('1h')">小时</button>
            </div>
        </div>
        <div style="position:relative;height:280px"><canvas id="pnl-chart"></canvas></div>
    </div>

    <!-- Holdings detail -->
    <div class="card p-4">
        <h3 class="text-sm font-semibold text-mute mb-3">持仓明细</h3>
        <div id="holdings-detail" class="space-y-1.5"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let symbolChart=null,sectorChart=null,pnlChart=null;

async function loadPortfolio(){
    try{
        const data=await api('/trades/portfolio?interval=1h');
        document.getElementById('s-cost').textContent='$'+data.total_cost.toFixed(2);
        document.getElementById('s-total').textContent='$'+data.total_value.toFixed(2);
        const totalPnl=data.holdings.reduce((s,h)=>s+h.pnl,0);
        const pnlEl=document.getElementById('s-pnl');
        pnlEl.innerHTML='$'+totalPnl.toFixed(2)+'<span class="text-sm ml-1">('+(totalPnl/data.total_cost*100).toFixed(2)+'%)</span>';
        pnlEl.className='text-2xl font-bold '+(totalPnl>=0?'up':'down');
        document.getElementById('s-syms').textContent=data.symbol_pie.length;
        renderPies(data);
        renderHoldings(data.holdings);
        renderPnlCurve(data.pnl_curve, data.events);
    }catch(e){}
}

async function loadPnlCurve(interval){
    document.getElementById('btn-1d').className='btn '+(interval==='1d'?'btn-acc':'btn-outline')+' btn-xs';
    document.getElementById('btn-1h').className='btn '+(interval==='1h'?'btn-acc':'btn-outline')+' btn-xs';
    try{
        const data=await api('/trades/portfolio?interval='+interval);
        renderPnlCurve(data.pnl_curve, data.events);
    }catch(e){}
}

function renderPies(data){
    const colors=['#296BEF','#00B887','#F59E0B','#F54D4D','#805ad5','#3182ce','#38a169','#dd6b20','#e53e3e','#8b5cf6'];

    function makePie(ctx, chartVar, items){
        if(chartVar)chartVar.destroy();
        const sorted=[...items].sort((a,b)=>b.value-a.value);
        const total=sorted.reduce((s,i)=>s+i.value,0);
        const labels=sorted.map(d=>d.name);
        const values=sorted.map(d=>d.value);
        const pcts=sorted.map(d=>(d.value/total*100).toFixed(1)+'%');
        return new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:colors}]},
            options:{responsive:true,maintainAspectRatio:false,
                plugins:{
                    legend:{position:'right',labels:{color:'#848E9C',font:{size:12},padding:14,boxWidth:10,usePointStyle:true,
                        generateLabels:function(chart){
                            const ds=chart.data.datasets[0];
                            return chart.data.labels.map((l,i)=>({
                                text:'  '+pcts[i]+'  '+l,
                                fillStyle:ds.backgroundColor[i],
                                strokeStyle:ds.backgroundColor[i],
                                lineWidth:0,hidden:false,index:i,
                                fontColor:'#848E9C',pointStyle:'circle',pointStyleWidth:8
                            }));
                        }}},
                    tooltip:{callbacks:{label:ctx=>ctx.label+': '+pcts[ctx.dataIndex]+' ($'+values[ctx.dataIndex].toFixed(2)+')'}}
                }}});
    }
    symbolChart=makePie(document.getElementById('symbol-pie').getContext('2d'),symbolChart,data.symbol_pie);
    sectorChart=makePie(document.getElementById('sector-pie').getContext('2d'),sectorChart,data.sector_pie);
}

function renderHoldings(holdings){
    const c=document.getElementById('holdings-detail');
    if(!holdings.length){c.innerHTML='<p class="text-mute text-sm text-center py-4">暂无持仓</p>';return;}
    const header='<div class="px-3 py-1"><div class="flex items-center gap-2 text-xs text-mute font-medium">'+
        '<span class="w-24 shrink-0">代码 / 名称</span>'+
        '<span class="w-14 shrink-0 text-center" style="margin-left:-4px">股数</span>'+
        '<span class="w-24 shrink-0">成本</span>'+
        '<span class="w-24 shrink-0">现值</span>'+
        '<span class="w-16 shrink-0 text-center" style="margin-left:-4px">涨跌</span>'+
    '</div></div>';
    c.innerHTML=header+holdings.map(h=>{
        const cost=h.open_price*h.quantity;
        const val=h.current_price*h.quantity;
        const chgPct=((h.current_price-h.open_price)/h.open_price*100);
        return `<div class="card px-3 py-2 bg-[#151b28]">
            <div class="flex items-center gap-2">
                <div class="w-24 shrink-0 leading-tight">
                    <span class="font-bold text-sm block">${h.symbol}</span>
                    <span class="text-mute text-[10px] block">${h.direction==='long'?'做多':'做空'}</span>
                </div>
                <span class="w-14 shrink-0 text-center text-base font-bold" style="margin-left:-4px">${h.quantity}</span>
                <div class="w-24 shrink-0 leading-tight">
                    <div class="font-medium text-sm">$${cost.toFixed(2)}</div>
                    <div class="text-xs text-mute">$${h.open_price.toFixed(2)}</div>
                </div>
                <div class="w-24 shrink-0 leading-tight">
                    <div class="${h.pnl>=0?'up':'down'} font-medium text-sm">$${val.toFixed(2)}</div>
                    <div class="${val>=cost?'up':'down'} text-xs">$${h.current_price.toFixed(2)}</div>
                </div>
                <div class="w-16 shrink-0 text-center text-xs" style="margin-left:-4px">
                    <span class="${chgPct>=0?'up':'down'}">${chgPct>=0?'+':''}${chgPct.toFixed(2)}%</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

function renderPnlCurve(curve, events){
    if(!curve.length)return;
    const ctx=document.getElementById('pnl-chart').getContext('2d');
    if(pnlChart)pnlChart.destroy();
    const lastPnl=curve[curve.length-1].pnl;

    // Map events to curve points
    const curveDates=curve.map(d=>d.date);
    const buyPoints=[], sellPoints=[];
    if(events){
        events.forEach(e=>{
            let idx=curveDates.indexOf(e.date);
            if(idx<0){for(let i=0;i<curveDates.length;i++){if(curveDates[i]>=e.date){idx=i;break;}}}
            if(idx>=0&&idx<curve.length){
                (e.type==='close'?sellPoints:buyPoints).push({x:curve[idx].date,y:curve[idx].pnl,label:e.label});
            }
        });
    }

    const datasets=[{label:'累计盈亏',data:curve.map(d=>d.pnl),
        borderColor:lastPnl>=0?'#00B887':'#F54D4D',backgroundColor:(lastPnl>=0?'#00B887':'#F54D4D')+'10',fill:true,tension:.3,pointRadius:0,borderWidth:2}];
    if(buyPoints.length){
        datasets.push({label:'开仓',data:buyPoints.map(p=>({x:p.x,y:p.y})),type:'scatter',
            backgroundColor:'#00B887',borderColor:'#00B887',pointRadius:5,pointStyle:'triangle',rotation:0,showLine:false});
    }
    if(sellPoints.length){
        datasets.push({label:'平仓',data:sellPoints.map(p=>({x:p.x,y:p.y})),type:'scatter',
            backgroundColor:'#F54D4D',borderColor:'#F54D4D',pointRadius:5,pointStyle:'triangleDown',showLine:false});
    }

    pnlChart=new Chart(ctx,{type:'line',data:{labels:curve.map(d=>d.date),datasets},
        options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
            plugins:{legend:{display:false},tooltip:{backgroundColor:'#1A2030',titleColor:'#E8EAED',bodyColor:'#848E9C',borderColor:'#2A3040',borderWidth:1,
                callbacks:{label:function(ctx){const bp=buyPoints.find(p=>p.x===ctx.label);if(bp)return bp.label;const sp=sellPoints.find(p=>p.x===ctx.label);if(sp)return sp.label;return '盈亏: $'+ctx.raw.toFixed(2);}}}},
            scales:{x:{ticks:{color:'#4A5466',maxTicksLimit:8,autoSkip:true},grid:{color:'#1A2030'}},y:{ticks:{color:'#4A5466',callback:v=>'$'+v.toFixed(0)},grid:{color:'#1A2030'}}}}});
}

loadPortfolio();
</script>
{% endblock %}
