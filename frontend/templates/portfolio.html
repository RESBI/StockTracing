{% extends "base.html" %}
{% block nav_portfolio %}text-text bg-white/5{% endblock %}
{% block content %}
<div class="p-6">
    <h1 class="text-xl font-bold mb-1">持仓分析</h1>
    <p class="text-sm text-mute mb-6">当前持仓、盈亏分布与收益曲线</p>

    <!-- Summary -->
    <div class="grid grid-cols-4 gap-3 mb-6" id="summary-row">
        <div class="card p-3 text-center"><p class="text-xs text-mute">持仓成本</p><p class="text-xl font-bold" id="s-cost">—</p></div>
        <div class="card p-3 text-center"><p class="text-xs text-mute">持仓总值</p><p class="text-xl font-bold" id="s-total">—</p></div>
        <div class="card p-3 text-center"><p class="text-xs text-mute">总浮盈</p><p class="text-xl font-bold" id="s-pnl">—</p></div>
        <div class="card p-3 text-center"><p class="text-xs text-mute">标的总数</p><p class="text-xl font-bold" id="s-syms">—</p></div>
    </div>

    <!-- Charts row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <div class="card p-4">
            <h3 class="text-sm font-semibold text-mute mb-3">标的占比</h3>
            <div style="position:relative;height:200px"><canvas id="symbol-pie"></canvas></div>
        </div>
        <div class="card p-4">
            <h3 class="text-sm font-semibold text-mute mb-3">领域占比</h3>
            <div style="position:relative;height:200px"><canvas id="sector-pie"></canvas></div>
        </div>
        <div class="card p-4">
            <h3 class="text-sm font-semibold text-mute mb-3">持仓明细</h3>
            <div id="holdings-list" class="space-y-1.5 max-h-[200px] overflow-y-auto text-xs"></div>
        </div>
    </div>

    <!-- P&L Curve -->
    <div class="card p-4 mb-6">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-mute">收益曲线</h3>
            <div class="flex gap-1">
                <button class="btn btn-outline btn-xs" id="btn-1d" onclick="loadPnlCurve('1d')">日线</button>
                <button class="btn btn-acc btn-xs" id="btn-1h" onclick="loadPnlCurve('1h')">小时</button>
            </div>
        </div>
        <div style="position:relative;height:280px"><canvas id="pnl-chart"></canvas></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let symbolChart=null,sectorChart=null,pnlChart=null;

async function loadPortfolio(){
    try{
        const data=await api('/trades/portfolio?interval=1h');
        const totalCost=data.total_cost;
        document.getElementById('s-cost').textContent='$'+totalCost.toFixed(2);
        document.getElementById('s-total').textContent='$'+data.total_value.toFixed(2);
        const totalPnl=data.holdings.reduce((s,h)=>s+h.pnl,0);
        const pnlEl=document.getElementById('s-pnl');
        pnlEl.textContent='$'+totalPnl.toFixed(2);
        pnlEl.className='text-xl font-bold '+(totalPnl>=0?'up':'down');
        document.getElementById('s-syms').textContent=data.symbol_pie.length;
        renderPies(data);
        renderHoldings(data.holdings);
        renderPnlCurve(data.pnl_curve);
    }catch(e){}
}

async function loadPnlCurve(interval){
    document.getElementById('btn-1d').className='btn '+(interval==='1d'?'btn-acc':'btn-outline')+' btn-xs';
    document.getElementById('btn-1h').className='btn '+(interval==='1h'?'btn-acc':'btn-outline')+' btn-xs';
    try{
        const data=await api('/trades/portfolio?interval='+interval);
        renderPnlCurve(data.pnl_curve);
    }catch(e){}
}

function renderPies(data){
    const colors=['#296BEF','#00B887','#F59E0B','#F54D4D','#805ad5','#3182ce','#38a169','#dd6b20','#e53e3e','#8b5cf6'];

    function makePie(ctx, chartVar, items){
        if(chartVar)chartVar.destroy();
        const sorted=[...items].sort((a,b)=>b.value-a.value);
        const total=sorted.reduce((s,i)=>s+i.value,0);
        return new Chart(ctx,{type:'doughnut',data:{labels:sorted.map(d=>d.name),datasets:[{data:sorted.map(d=>d.value),backgroundColor:colors}]},
            options:{responsive:true,maintainAspectRatio:false,
                plugins:{
                    legend:{position:'right',labels:{color:'#848E9C',font:{size:10},padding:12,boxWidth:8,usePointStyle:true,pointStyleWidth:8,
                        generateLabels:function(chart){
                            const data=chart.data;
                            return data.labels.map((label,i)=>({
                                text:label+'  '+(data.datasets[0].data[i]/total*100).toFixed(1)+'%',
                                fillStyle:data.datasets[0].backgroundColor[i],
                                strokeStyle:data.datasets[0].backgroundColor[i],
                                lineWidth:0,hidden:false,index:i,pointStyle:'rect',rotation:0
                            }));
                        }}},
                    tooltip:{callbacks:{label:ctx=>ctx.label+': '+(ctx.raw/total*100).toFixed(1)+'% ($'+ctx.raw.toFixed(2)+')'}}
                }}});
    }
    symbolChart=makePie(document.getElementById('symbol-pie').getContext('2d'),symbolChart,data.symbol_pie);
    sectorChart=makePie(document.getElementById('sector-pie').getContext('2d'),sectorChart,data.sector_pie);
}

function renderHoldings(holdings){
    const c=document.getElementById('holdings-list');
    if(!holdings.length){c.innerHTML='<p class="text-mute">暂无持仓</p>';return;}
    c.innerHTML=holdings.map(h=>`<div class="flex justify-between py-1 border-b border-bord/30 last:border-0">
        <span class="font-medium">${h.symbol}</span>
        <span class="text-mute">${h.quantity}股</span>
        <span class="${h.pnl>=0?'up':'down'}">${h.pnl>=0?'+':''}${h.pnl.toFixed(2)} (${h.pnl_pct>=0?'+':''}${h.pnl_pct}%)</span>
    </div>`).join('');
}

function renderPnlCurve(curve){
    if(!curve.length)return;
    const ctx=document.getElementById('pnl-chart').getContext('2d');
    if(pnlChart)pnlChart.destroy();
    const lastPnl=curve[curve.length-1].pnl;
    pnlChart=new Chart(ctx,{type:'line',data:{labels:curve.map(d=>d.date),datasets:[{label:'累计盈亏',data:curve.map(d=>d.pnl),
        borderColor:lastPnl>=0?'#00B887':'#F54D4D',backgroundColor:(lastPnl>=0?'#00B887':'#F54D4D')+'10',fill:true,tension:.3,pointRadius:0,borderWidth:2}]},
        options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
            plugins:{legend:{display:false},tooltip:{backgroundColor:'#1A2030',titleColor:'#E8EAED',bodyColor:'#848E9C',borderColor:'#2A3040',borderWidth:1}},
            scales:{x:{ticks:{color:'#4A5466',maxTicksLimit:8,autoSkip:true},grid:{color:'#1A2030'}},y:{ticks:{color:'#4A5466',callback:v=>'$'+v.toFixed(0)},grid:{color:'#1A2030'}}}}});
}

loadPortfolio();
</script>
{% endblock %}
